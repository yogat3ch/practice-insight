name: Bug Report
description: Report a problem with Practice Insight
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much detail as you can so we can reproduce and fix it.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear, concise description of the bug.
      placeholder: "When I select a custom date range, the Timeline chart goes blank."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do, step by step?
      placeholder: |
        1. Open the app
        2. Upload my CSV
        3. Set a custom date range
        4. Switch to the Comparison tab
      validations:
        required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened instead?
    validations:
      required: true
  - type: textarea
    id: csv
    attributes:
      label: Sample data (optional)
      description: A small, anonymized sample of the CSV that triggers the bug. Removes any personal details first.
      render: csv
  - type: input
    id: browser
    attributes:
      label: Environment
      description: Browser and version you were using.
      placeholder: "Chrome 126, Safari 17, Firefox 127, ..."
    validations:
      required: true
