name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync SvelteKit (generate .svelte-kit/tsconfig.json)
        run: npx svelte-kit sync

      - name: Check (svelte-check)
        run: npm run check

      - name: Test (vitest)
        run: npm test

      - name: Build
        run: npm run build
